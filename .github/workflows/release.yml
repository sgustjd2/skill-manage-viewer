name: Release

# Every push to main: if the commits since the last tag call for a new version, bump VERSION, tag it and publish a release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags and every commit since the last one
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: release
        run: python tools/release.py release-notes.md  # untracked: only read by the next step
      - if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.release.outputs.version }}
        run: |
          git push origin HEAD:main "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
