name: Release

# Every push to main: if the commits since the last tag call for a new version, bump VERSION, tag it and publish a release,
# then build the Windows installer (exe job) and the macOS app (mac job) from that tag, attach them and only then publish
# the release (publish job; it is a draft until then). The exe is required, the dmg is not (see the publish job).
# A pull request only builds and tests both (nothing is published). "Run workflow" builds both for a tag that already
# exists and attaches them to that release (the tag must contain tools/build_exe.py, i.e. be v1.1.0 or later;
# tools/build_mac.py for the macOS app).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tools/build_exe.py"
      - "tools/build_mac.py"
      - "tools/skilldesk.iss"
      - "skill_viewer.py"
      - "skill_viewer.ico"
      - "VERSION"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the installers to (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('exe-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags and every commit since the last one
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: release
        run: python tools/release.py release-notes.md  # untracked: only read by the next step
      - if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.release.outputs.version }}
        run: |
          git push origin HEAD:main "$TAG"
          gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md  # shown to nobody until the installer is attached

  # A tag made with GITHUB_TOKEN does not start other workflows, so the build is a job of this one.
  exe:
    needs: release
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.release.outputs.version != '') }}
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'push' && format('v{0}', needs.release.outputs.version) || github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}  # the tagged commit, so VERSION inside the exe is the released one (empty on a pull request: its own commit)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches VERSION
        if: env.TAG != ''
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          if ($env:TAG -ne "v$v") { throw "tag $env:TAG does not match VERSION $v" }
          if (-not (Test-Path tools/build_exe.py)) { throw "$env:TAG predates the installer build (tools/build_exe.py is missing)" }
      - run: python -m pip install -r requirements.txt pyinstaller==6.11.1
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - run: python tools/build_exe.py
      - name: Smoke test the installer (install, start, uninstall)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          $setup = "dist\SkillDesk-Setup-v$v.exe"
          $app = Join-Path $env:LOCALAPPDATA "Programs\SkillDesk"
          $log = Join-Path $HOME ".skill-manager\error.log"
          function Fail($m) { if (Test-Path $log) { Get-Content $log }; throw $m }

          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          foreach ($p in "SkillDesk.exe", "_internal\VERSION", "_internal\skilldesk\assets\fonts\Pretendard-Regular.otf",
                         "_internal\skilldesk\data\skill_notes.json", "_internal\skilldesk\data\skill_recommend.json") {
            if (-not (Test-Path (Join-Path $app $p))) { Fail "missing after install: $p" }
          }
          if ((Get-Content (Join-Path $app "_internal\VERSION")).Trim() -ne $v) { Fail "VERSION inside the exe is not $v" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\SkillDesk.lnk")) { Fail "no Start menu shortcut" }

          $run = Start-Process (Join-Path $app "SkillDesk.exe") -ArgumentList "--check" -Wait -PassThru
          if ($run.ExitCode -ne 0) { Fail "SkillDesk.exe --check exited with $($run.ExitCode)" }

          $tray = Start-Process (Join-Path $app "SkillDesk.exe") -ArgumentList "--hidden" -PassThru  # the real start-up: window, fonts, tray
          Start-Sleep -Seconds 10
          if ($tray.HasExited) { Fail "SkillDesk.exe --hidden exited with $($tray.ExitCode) within 10 seconds" }
          Stop-Process -Id $tray.Id -Force

          Start-Process (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $app "SkillDesk.exe")); $i++) { Start-Sleep -Seconds 1 }  # the uninstaller finishes in a copy of itself
          if (Test-Path (Join-Path $app "SkillDesk.exe")) { Fail "uninstall left SkillDesk.exe behind" }
          Write-Host "installer smoke test passed for v$v"
      - name: Keep the installer from this pull request for 3 days (to try it by hand)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SkillDesk-Setup
          path: dist/SkillDesk-Setup-v*.exe
          retention-days: 3
      - name: Attach the installer to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-Item dist/SkillDesk-Setup-v*.exe).FullName --clobber
        shell: pwsh

  # Same shape as the exe job, on macOS. Its build is not required for a release yet (see MAC_REQUIRED in the publish job),
  # but on a pull request it always runs and a failure turns the check red.
  mac:
    needs: release
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.release.outputs.version != '') }}
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'push' && format('v{0}', needs.release.outputs.version) || github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}  # the tagged commit, so VERSION inside the app is the released one (empty on a pull request: its own commit)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches VERSION
        if: env.TAG != ''
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG does not match VERSION $v"; exit 1; }
          [ -f tools/build_mac.py ] || { echo "::error::$TAG predates the macOS build (tools/build_mac.py is missing)"; exit 1; }
      - run: python -m pip install -r requirements.txt pyinstaller==6.11.1
      - run: python tools/build_mac.py
      - name: Smoke test the app (open the dmg, copy the app out, start it)
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          dmg=$(ls dist/SkillDesk-v"$v"-macOS-*.dmg)
          work=$(mktemp -d)
          log="$HOME/.skill-manager/error.log"
          fail() { [ -f "$log" ] && cat "$log"; echo "::error::$1"; exit 1; }

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$work/dmg" > /dev/null
          [ -d "$work/dmg/SkillDesk.app" ] || fail "no SkillDesk.app in the dmg"
          [ -L "$work/dmg/Applications" ] || fail "no Applications shortcut in the dmg"
          ditto "$work/dmg/SkillDesk.app" "$work/SkillDesk.app"  # what dragging it to Applications does
          hdiutil detach "$work/dmg" > /dev/null
          app="$work/SkillDesk.app"
          bin="$app/Contents/MacOS/SkillDesk"

          echo "CPU of the app: $(lipo -archs "$bin") (this machine: $(uname -m))"
          codesign --verify --deep --strict "$app" || fail "the ad-hoc signature does not verify"
          for f in skilldesk/assets/fonts/Pretendard-Regular.otf skilldesk/data/skill_notes.json skilldesk/data/skill_recommend.json; do
            [ -n "$(find "$app/Contents" -path "*/$f")" ] || fail "missing in the app: $f"
          done
          [ -n "$(find "$app/Contents" -maxdepth 3 -name VERSION -exec grep -lx "$v" {} +)" ] || fail "VERSION inside the app is not $v"

          "$bin" --check > "$work/check.txt" || { rc=$?; cat "$work/check.txt"; fail "SkillDesk --check exited with $rc"; }

          "$bin" --hidden > "$work/hidden.txt" 2>&1 &  # the real start-up: window, fonts, lock, menu-bar process
          pid=$!
          sleep 10
          kill -0 "$pid" 2> /dev/null || { cat "$work/hidden.txt"; fail "SkillDesk --hidden exited within 10 seconds"; }
          pgrep -f -- "$bin --tray-child" > /dev/null || { cat "$work/hidden.txt"; fail "the menu-bar process (--tray-child) is not running"; }
          pkill -f "$bin" || true
          echo "macOS app smoke test passed for v$v"
      - name: Keep the dmg from this pull request for 3 days (to try it by hand)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SkillDesk-macOS
          path: dist/SkillDesk-v*-macOS-*.dmg
          retention-days: 3
      - name: Attach the dmg to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/SkillDesk-v*-macOS-*.dmg --clobber

  # The one place a release goes public. The Windows installer must be attached; the macOS dmg may be missing (and the notes
  # then say so) until the macOS build has proved stable: then set MAC_REQUIRED to "true" and a missing dmg keeps the draft.
  publish:
    needs: [release, exe, mac]
    if: ${{ !cancelled() && needs.exe.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.release.outputs.version != '')) }}
    runs-on: ubuntu-latest
    env:
      MAC_REQUIRED: "false"
      MAC: ${{ needs.mac.result }}
      TAG: ${{ github.event_name == 'push' && format('v{0}', needs.release.outputs.version) || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the release (it was a draft, so nobody saw it before its installers were attached)
        run: |
          if [ "$MAC" != success ] && [ "$MAC_REQUIRED" = true ]; then
            echo "::error::the macOS app was not built and MAC_REQUIRED is on: the release stays a draft"; exit 1
          fi
          gh release view "$TAG" --json body --jq .body | sed '/<!-- mac-missing -->/,$d' > notes.md  # drop a note left by an earlier run
          [ -s notes.md ] || { echo "::error::the notes of $TAG could not be read"; exit 1; }
          if [ "$MAC" != success ]; then
            printf '%s\n' '' '<!-- mac-missing -->' \
              '> ⚠ **이번 릴리스에는 macOS 설치 파일이 없습니다.** macOS 빌드가 실패했습니다. macOS에서는 위의 "소스로 설치"를 쓰거나 다음 릴리스를 기다려 주세요. Windows 설치 파일은 정상입니다.' >> notes.md
          fi
          gh release edit "$TAG" --notes-file notes.md --draft=false
